<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                document.documentElement.setAttribute('data-theme',
                    saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
            } catch (e) {}
        })();
    </script>
    <title>Page introuvable — Sacha Ringot</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#EDE8DE">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23332C22'/><text x='50%' y='50%' font-family='sans-serif' font-weight='bold' font-size='46' fill='%23F6F2EA' dominant-baseline='middle' text-anchor='middle'>SR</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .wrap { max-width: 460px; }
        .code { font-size: clamp(4rem, 14vw, 7rem); font-weight: 800; letter-spacing: -0.06em; line-height: 1; color: var(--text-primary); }
        h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em; margin: 1rem 0 0.6rem; color: var(--text-primary); }
        p { font-size: 0.9rem; font-weight: 300; color: var(--text-secondary); line-height: 1.7; margin-bottom: 2rem; }
        a { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.4rem; border: 1px solid var(--border); border-radius: 100px; color: var(--text-secondary); text-decoration: none; font-size: 0.84rem; transition: all 0.3s ease; }
        a:hover { color: var(--text-primary); border-color: var(--text-primary); background: var(--hover-bg); }
    </style>
</head>
<body>
    <main class="wrap">
        <p class="code">404</p>
        <h1>Cette page n'existe pas</h1>
        <p>Le lien est peut-être obsolète, ou l'adresse comporte une faute de frappe.</p>
        <a href="/">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Retour au portfolio
        </a>
    </main>
    <script src="js/theme.js" defer></script>
</body>
</html>
